name: Cleanup Actions artifacts

on:
  push:
    paths:
      - '.github/workflows/cleanup-actions.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Actions artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          deleted=0
          bytes=0

          while IFS=$'\t' read -r id created size name; do
            created_epoch="$(date -u -d "$created" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "delete artifact id=$id name=$name size=$size created=$created"
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted=$((deleted + 1))
              bytes=$((bytes + size))
            fi
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .created_at, .size_in_bytes, .name] | @tsv'
          )

          echo "deleted_artifacts=$deleted"
          echo "deleted_bytes=$bytes"
          awk -v b="$bytes" 'BEGIN { printf "deleted_mib=%.2f\n", b/1024/1024 }'
